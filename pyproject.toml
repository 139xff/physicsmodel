[project]
name = "em-workbench"
version = "0.1.0"
description = "Interactive electrostatics workbench for university electromagnetism learners"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "numpy>=2.2,<3",
    "pydantic>=2.11,<3",
    "scipy>=1.15,<2",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "playwright>=1.54,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
